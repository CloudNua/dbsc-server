name: Release

# Manual publish workflow. This release uses the one-time NPM_TOKEN path with
# an explicit --provenance flag. After the first publish, the workflow moves to
# trusted publishing (OIDC): the token env goes away and provenance becomes
# automatic. Provenance requires the id-token permission and a public repo.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:zero-deps
      - run: npm run build
      - run: npm test
      - name: Publish
        # Prereleases go to the "next" dist-tag so `npm install dbsc-server`
        # never resolves to an rc. Stable versions go to "latest".
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=latest
          case "$VERSION" in *-*) TAG=next ;; esac
          echo "publishing $VERSION with dist-tag $TAG"
          npm publish --provenance --access public --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
