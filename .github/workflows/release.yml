name: Release

# Publishes via npm trusted publishing (OIDC). No token: npm trusts this
# workflow directly, and provenance is generated automatically. Requirements:
# id-token permission, registry-url configured, npm CLI 11.5.1 or later, and
# the trusted publisher configured on the npm package settings for this repo
# and workflow filename.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:zero-deps
      - run: npm run build
      - run: npm test
      - name: Publish
        # Prereleases go to the "next" dist-tag so `npm install dbsc-server`
        # never resolves to an rc. Stable versions go to "latest".
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=latest
          case "$VERSION" in *-*) TAG=next ;; esac
          echo "publishing $VERSION with dist-tag $TAG"
          npm publish --access public --tag "$TAG"
